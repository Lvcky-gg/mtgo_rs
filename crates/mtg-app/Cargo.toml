[package]
name = "mtg-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Stable, and sufficient for a board of panels and card images. See ADR-009 and ADR-010.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
# The app hosts and joins games, so it needs the real transport.
mtg-session = { workspace = true, features = ["transport"] }
# "Download from Scryfall" on the Decks screen.
mtg-oracle = { workspace = true, features = ["fetch"] }
mtg-ir = { workspace = true }
mtg-deck = { workspace = true }
mtg-core = { workspace = true }
mtg-engine = { workspace = true }
mtg-policy = { workspace = true }
mtg-store = { workspace = true }
mtg-net = { workspace = true, features = ["transport"] }
mtg-headless = { workspace = true }
# Card images: fetched from Scryfall's CDN on first view, cached on disk, decoded off the UI
# thread. Scryfall serves JPEG (and PNG for the large scans); nothing else is needed.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
resvg = { version = "0.48.1", default-features = false }

[[bin]]
name = "mtg-gui"
path = "src/main.rs"

[lints]
workspace = true
