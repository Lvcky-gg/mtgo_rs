[package]
name = "mtg-verify"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mtg-core = { workspace = true }
mtg-ir = { workspace = true }
mtg-policy = { workspace = true }
mtg-oracle = { workspace = true }
mtg-deck = { workspace = true }
mtg-net = { workspace = true }
mtg-engine = { workspace = true, features = ["verification"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "mtgo-rs"
path = "src/main.rs"

[lints]
workspace = true
